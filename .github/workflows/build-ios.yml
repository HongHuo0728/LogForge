name: iOS build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'LogForgeMac/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-ios.yml'
      - '.github/scripts/release_target.py'
      - '.github/scripts/publish_ios_release.py'
      - '.github/scripts/test_publish_ios_release.py'
      - 'tests/release_target.py'
  pull_request:
    paths:
      - 'LogForgeMac/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-ios.yml'
      - '.github/scripts/release_target.py'
      - '.github/scripts/publish_ios_release.py'
      - '.github/scripts/test_publish_ios_release.py'
      - 'tests/release_target.py'
  workflow_dispatch:
    inputs:
      duo_checks:
        description: Run Duo UI and posture checks required for a new release
        type: boolean
        default: false
      extended_checks:
        description: Run the optional full native, compatibility and interaction suites
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: LogForgeMac

jobs:
  release-target:
    name: Select iOS release target
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test platform release routing
        run: |
          python3 tests/release_target.py
          python3 LogForgeMac/tools/test_package_audit.py
          python3 .github/scripts/test_publish_ios_release.py
          python3 LogForgeMac/tools/test_collect_verification.py
      - name: Check Swift source, project membership and localization
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/logforge-static" -r LogForgeMac/tools/requirements-static.txt
          python3 LogForgeMac/tools/static_check.py --checkout-only --parser-root "$RUNNER_TEMP/logforge-static" --report "$RUNNER_TEMP/static-validation.json"
      - name: Select release platform
        id: release
        run: python3 .github/scripts/release_target.py --platform ios

  iphone:
    needs: release-target
    if: needs.release-target.outputs.should_build == 'true' && github.ref_type != 'tag'
    name: Build, audit and core tests
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      LOGFORGE_NATIVE_SUITE: ${{ inputs.extended_checks && 'full' || inputs.duo_checks && 'release-smoke' || 'core' }}
      LOGFORGE_DUO_SUITE: ${{ inputs.extended_checks && 'full' || 'release-smoke' }}
      LOGFORGE_COMPAT_SUITE: ${{ inputs.extended_checks && 'full' || 'release-smoke' }}
    outputs:
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 27.1 and install required simulator runtimes
        run: bash tools/prepare-xcode.sh
      - name: Prepare and verify Duo automation versions
        if: inputs.duo_checks || inputs.extended_checks
        id: automation
        timeout-minutes: 5
        run: bash tools/run-duo-tests.sh prepare
      - name: Check release identity and tag
        id: identity
        run: |
          python3 tools/test_release_info.py
          version=$(python3 tools/release-info.py)
          release_build=$(python3 tools/release-info.py --release-build)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Tag and iOS project version differ' >&2
            exit 1
          fi
          artifact_kind=core
          if [[ "$LOGFORGE_NATIVE_SUITE" != core ]]; then artifact_kind=unsigned; fi
          artifact="LogForge-$version-iOS-$release_build-$artifact_kind-$GITHUB_RUN_NUMBER"
          printf 'LOGFORGE_ARTIFACT=%s\n' "$artifact" >> "$GITHUB_ENV"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
      - name: Archive and package iPhone release
        id: archive
        timeout-minutes: 25
        run: bash tools/build-ios.sh archive
      - name: Audit release bytes
        run: python3 tools/audit-package.py build/artifacts 2>&1 | tee build/logs/package-audit.log
      - name: Upload candidate build before simulator checks
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LogForge-iOS-candidate-${{ github.run_number }}
          path: |
            LogForgeMac/build/artifacts/*
            LogForgeMac/build/logs/package-audit.log
          if-no-files-found: error
          retention-days: 14
      - name: Native core tests (UI and media tests only when requested)
        id: duo
        timeout-minutes: 25
        run: bash tools/build-ios.sh test duo
      - name: Upload Duo regression logs and screenshots immediately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LogForge-Duo-regression-${{ github.run_number }}
          path: |
            LogForgeMac/build/logs/tests-duo*
            LogForgeMac/build/logs/attachments-duo/
          if-no-files-found: warn
          retention-days: 14
      - name: Real Duo poses and state continuity
        if: ${{ !cancelled() && (inputs.duo_checks || inputs.extended_checks) && steps.automation.outcome == 'success' }}
        timeout-minutes: 30
        run: bash tools/run-duo-tests.sh
      - name: Upload Duo interaction diagnostics immediately
        if: ${{ always() && (inputs.duo_checks || inputs.extended_checks) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LogForge-Duo-interactions-${{ github.run_number }}
          path: LogForgeMac/build/logs/duo/
          if-no-files-found: warn
          retention-days: 14
      - name: iOS 26 compatibility regression tests
        if: ${{ !cancelled() && inputs.extended_checks }}
        timeout-minutes: 15
        run: bash tools/build-ios.sh test phone26
      - name: iPad regression tests
        if: ${{ !cancelled() && inputs.extended_checks }}
        timeout-minutes: 15
        run: bash tools/build-ios.sh test ipad
      - name: Record the checks actually performed
        run: |
          if [[ "$LOGFORGE_NATIVE_SUITE" == core ]]; then
            python3 tools/collect-verification.py --core-only
          else
            python3 tools/collect-verification.py
          fi
      - name: Upload IPA, checksums and relink sources
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.LOGFORGE_ARTIFACT }}
          path: LogForgeMac/build/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LogForge-iOS-diagnostics-${{ github.run_number }}
          path: |
            LogForgeMac/build/logs/
            LogForgeMac/build/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified iOS release with original Windows 1.3.0 assets
    needs: release-target
    if: needs.release-target.outputs.should_build == 'true' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Promote the verified main build, read back all six assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_ios_release.py release-artifacts --download-verified
